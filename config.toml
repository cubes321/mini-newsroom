# Mini Newsroom configuration

[broadcast]
width = 960
height = 540
fps = 60
horizon_s = 600          # seconds of unplayed content the producer keeps queued
words_per_minute = 150   # used to turn target seconds into a word budget

[llm]
default_provider = "claude_haiku"
timeout_s = 90
first_call_timeout_s = 120
max_tokens = 700
temperature = 0.8
# Write every call's prompt, reply and token counts to data/llm_calls/<date>.jsonl
# (roughly 5 MB a day). Also switched on by --log-llm or NEWSROOM_LLM_LOG=1.
log_calls = false

# Which provider writes which segment type. Any name under [llm.providers].
# Haiku live since 2026-10-26. The back office moved from Sonnet to DeepSeek Flash (thinking) on
# 2026-10-30, after the 2026-10-29 night cost $0.23 against Sonnet's $1.89 for the same 12h50m;
# Sonnet stays as the senior editor and as Flash's fallback. `--route deepseek_flash_think=claude_sonnet`
# puts the back office back on Sonnet for a run.
# Kimi ("moonshot" live, "moonshot_k3" back office) is still declared below to switch back.
[llm.routes]
weather = "claude_haiku"
bulletin = "claude_haiku"
field_report = "claude_haiku"
sofa = "claude_haiku"             # breakfast: the two hosts chatting
interview = "claude_haiku"        # studio guests: news, magazine, talk show
links = "claude_haiku"            # magazine
feature = "claude_haiku"
vox_pop = "claude_haiku"
consumer = "claude_haiku"
monologue = "claude_haiku"        # talk show
editor = "deepseek_flash_think"          # decides whether a thread deserves a special
documentary_commission = "deepseek_flash_think"   # picks the day's documentary subject
documentary_research = "deepseek_flash_think"     # research notes from the archive, before the outline
special_outline = "deepseek_flash_think"
special_section = "deepseek_flash_think"
story_desk = "deepseek_flash_think"      # plans how threads develop, seeds new ones
inquiry = "deepseek_flash_think"         # picks tonight's story for The Inquiry, its questions and its guest
senior_editor = "claude_sonnet"   # reviews the desk's board every [story] review_every_s and leaves it a memo
breaking = "claude_haiku"         # breaking news from the tip-line
advert = "claude_haiku"           # local adverts, written in idle time
promo = "claude_haiku"            # continuity: trails for specials, community notices

# Special reports (documentary v0). The editor runs on the worker thread when
# it is idle; a commissioned special is a low-priority job that plays at the
# next break (a news bumper, or the overnight test card) once it is ready.
[special]
check_every_s = 1800     # how often the editor looks at the open threads (every 15 min it said no 38 times a night)
cooldown_s = 3600        # minimum gap between specials
target_s = 300           # length of a special
min_mentions = 2         # a thread needs this much coverage to be considered
min_buffer_frac = 0.8    # background work (editor, story desk) only when the live buffer is this full

# The nightly documentary (documentary.py): fifteen minutes on a long-running thread or a piece of
# town history, researched from the archive. One a day, commissioned in idle time and made in stages
# between live slots like a special; it airs at the first news bumper from airs_at.
[documentary]
title = "PORT WEXLEY STORIES"
target_s = 900
commission_from = "18:00" # late enough to cover the day; making one takes minutes, not hours
airs_at = "21:00"
window_s = 3600          # not ready within an hour of airs_at: it waits for tomorrow's slot
repeat_at = "02:00"      # and the night's documentary airs again after the first overnight test card from here

# The Inquiry (inquiry.py, docs/SHOWS.md): Pat Holloway takes one story in depth at 20:00. From
# commission_from the back office picks it from the stories with min_mentions or more that haven't been
# investigated in rest_days, with the questions Pat puts and the guest who has to answer them.
[inquiry]
commission_from = "18:30"
airs_at = "20:00"
min_mentions = 3
rest_days = 7

# The story desk gives threads a phase and a planned next development, closes
# finished ones and occasionally seeds a new story, so follow-ups move things on.
[story]
plan_every_s = 1800     # every 30 min: the desk is the biggest cost on any provider
# New stories the desk plans itself: one a round, two while fewer than thin_board are open, and no more
# than seeds_per_day a day with the senior editor's. Until 2026-10-30 the desk seeded only while fewer
# than 8 threads were open, and the writers keep 11 to 17 open, so it was told to seed none all night.
thin_board = 8
seeds_per_day = 8
batch = 8                # threads planned per desk call; the whole board in one reply overran max_tokens
# The senior editor (senior.py) reads the whole board and the desk's recent plans every two hours and
# leaves the desk a memo (and merges duplicates itself): on 2026-10-29 Flash steered 11 of 24 plans onto
# one council meeting and opened no threads, and on 2026-10-28 Sonnet held the same eight all night.
review_every_s = 7200
# Threads fade off the air when they stop moving (hours of air time without a new beat), and past
# max_live_threads open the stalest fade. A faded thread comes back on a follow-up or from the desk.
max_live_threads = 40
fade_oneoff_h = 8        # covered once or twice
fade_quiet_h = 24
fade_resolving_h = 12
fade_peak_h = 72

# The viewer tip-line: one tip per line in data/tipline.txt (python -m newsroom.tipline "...").
# A plain tip is offered to the next bulletins; a line starting "BREAKING:" interrupts
# whatever is on at the next sentence, with Dana at the news desk.
[breaking]
cooldown_s = 900         # a second BREAKING line within this becomes a plain tip
target_s = 60
max_age_s = 600          # BREAKING lines older than this when first read (a restart) become plain tips
tip_ttl_s = 21600        # a plain tip nobody used is dropped after this
max_tips = 3             # tips offered to one bulletin
desk_per_day = 1         # the story desk may also break a story itself, at most this often, never overnight
scene_window_s = 2700    # Miles reports from the scene in the first field report this long after a break

# Local adverts: an evergreen pool of voiced ads in data/ads that covers the gaps when the
# next segment isn't ready. A hand-written set is always there; the model adds more in idle time.
[adverts]
pool_size = 40
make_every_s = 1800
max_in_a_row = 3         # then the filler card and the weather replay

[continuity]
notice_every_s = 2700    # a community notice from the day's open stories, in idle time
notices_per_day = 4

# kind = "openai" means any OpenAI-compatible chat endpoint (LM Studio,
# llama.cpp server, Moonshot, ...). api_key_env names the env var holding the
# key; leave it empty for local servers. extra_body is passed through as-is.
[llm.providers.lmstudio]
kind = "openai"
base_url = "http://localhost:1234/v1"
api_key_env = ""
model = "qwen/qwen3.5-9b"
# LM Studio ignores enable_thinking; reasoning_effort "none" is what turns thinking off
# (tested 2026-10-26 on qwen3.5/3.6, gemma 4 and glm-4.7).
extra_body = { reasoning_effort = "none" }

[llm.providers.moonshot]
kind = "openai"
base_url = "https://api.moonshot.ai/v1"
api_key_env = "MOONSHOT_API_KEY"
model = "kimi-k2.6"          # also available: kimi-k3, kimi-k3.1-pro(-highspeed)
# k2.6 is a thinking model. Thinking off is faster and cheaper for short
# scripts; in that mode it only accepts temperature 0.6 (with thinking on,
# only 1.0, and max_tokens needs ~4000 to leave room for the reasoning).
temperature = 0.6
max_tokens = 2000
extra_body = { thinking = { type = "disabled" } }

[llm.providers.moonshot_k3]
kind = "openai"
base_url = "https://api.moonshot.ai/v1"
api_key_env = "MOONSHOT_API_KEY"
model = "kimi-k3"
# thinking on for editorial judgment and long-form writing: needs temperature
# 1.0 and headroom for reasoning tokens
temperature = 1.0
max_tokens = 6000
# A thinking k3 call regularly runs past 90s (the overnight story desk failed 23 of 28). With
# one worker, a call blocks live production; 240s with no SDK retry stays inside the 480s of
# buffer the background work waits for.
timeout_s = 240
max_retries = 0

# DeepSeek: Flash thinking runs the back office (see [llm.routes]); try v4-pro there for a run with
# `--route deepseek_flash_think=deepseek_pro`, or `--route claude_haiku=deepseek_flash` (live). The key
# comes from DEEPSEEK_API_KEY.
# Prices checked 2026-10-28 (third-party listings; confirm on the console): v4-pro $0.66 in /
# $1.98 out per million off-peak, double at peak (01:00-04:00 and 06:00-10:00 UTC); Flash about
# $0.15 / $0.60 off-peak, dearer than Haiku 5.5, so the back office is where it could save.
[llm.providers.deepseek_pro]
kind = "openai"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-v4-pro"
extra_body = { thinking = { type = "enabled" }, reasoning_effort = "high" }
# Reasoning counts against it: at 8000 a desk plan spent the lot thinking and answered nothing
# (2026-10-28). About 125 tokens/s, so 24000 still fits the timeout.
max_tokens = 24000
timeout_s = 240
max_retries = 0                    # as for k3 and Sonnet: a retried timeout blocks live production
fallback = "claude_sonnet"         # a call it fails (twice invalid, or unreachable) goes to Sonnet once

[llm.providers.deepseek_flash]
kind = "openai"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-flash"
extra_body = { thinking = { type = "disabled" } }
max_tokens = 2000
timeout_s = 60

# The same Flash (V4.1-Flash-1017 since October) thinking, for the back office: on third-party
# benchmarks it matches or beats v4-pro (Artificial Analysis index 39 to 36, about twice as fast)
# except on knowledge-heavy tests and hallucination, at about a quarter of the price.
[llm.providers.deepseek_flash_think]
kind = "openai"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-flash"
extra_body = { thinking = { type = "enabled" }, reasoning_effort = "high" }
max_tokens = 16000                 # a desk plan took 6400 (5600 of them reasoning) at about 170/s
timeout_s = 240
max_retries = 0
# A call it fails goes to Sonnet once. Worst case a Flash timeout then a slow Sonnet call holds the
# worker 480 s, about the buffer background work waits for (Sonnet's desk median is 7 s).
fallback = "claude_sonnet"

[llm.providers.anthropic]
kind = "anthropic"
model = "claude-opus-5-5"

# Claude, benched against Kimi on 2026-10-26 (see TODO.md) and the routing since. The key comes
# from ANTHROPIC_API_KEY.
# extra_body takes `thinking` and `effort` (low/medium/high/xhigh/max; Haiku defaults to medium,
# Sonnet to high). No temperature: these models reject it.
[llm.providers.claude_haiku]       # live scripts: 3.5 s, about a tenth of Kimi's price
kind = "anthropic"
model = "claude-haiku-5-5"
max_tokens = 2000
timeout_s = 60
extra_body = { thinking = { type = "disabled" } }
# The town, presenters and public figures at the top of every briefing, with the system prompt and
# schema, are cached for an hour: a read costs a tenth, the first write twice, and every read
# restarts the hour, so even the editor and the desk (every 30 min) stay cached.
cache_ttl = "1h"

[llm.providers.claude_sonnet]      # senior editor and Flash's fallback (the back office until 2026-10-30): thinking on
kind = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16000                 # thinking counts against it
timeout_s = 240
max_retries = 0                    # as for k3: a retried timeout blocks live production twice as long
extra_body = { effort = "high" }
cache_ttl = "1h"

[tts]
backend = "kokoro"
lang_code = "a"          # Kokoro: "a" American, "b" British
sample_rate = 24000
device = "cpu"
british_guests = true   # guests cast as locals get Kokoro's British pronunciation (chosen by ear 2026-10-27)

[tts.voices]
anchor = "af_heart"
weather = "bm_george"
reporter = "am_michael"
host_a = "bf_lily"       # Morning Tide (breakfast)
host_b = "am_eric"
mag_a = "bf_alice"       # Coastwide (early-evening magazine)
mag_b = "am_liam"
late_host = "am_onyx"    # The Last Ferry (late-night talk show)
sport = "af_jessica"     # Fran Kellaway, sport (the news, and Full Time at 18:45)
sport_reporter = "af_sarah"   # Tamsin Jago, Full Time's reporter: PROVISIONAL, to be chosen by ear (2026-10-30)
historian = "am_santa"   # Hugh Tremayne, the history documentaries (and the entertainment channel's)

[paths]
data = "data"
cache = "data/cache"
world = "data/world.json"
tipline = "data/tipline.txt"
ads = "data/ads"
assets = "assets"
