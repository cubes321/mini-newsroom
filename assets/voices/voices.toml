# Port Wexley guest voices: reference clips cloned live by Pocket TTS (tts.py). File <voice>.b.wav: that voice as
# a local (British accent). gender and age cast them: a new guest gets a voice of their gender and age, by name
# (world.guest_pool), and a clip of the wrong age is swapped for one of theirs (tts.clip_for). Age "teen"
# (af_sky, bm_jowan) is only for a guest whose role says they are a teenager: a pupil, a sixth former.
# Designed with DramaBox (Resemble AI, LTX-2.3 audio) from the description alone, seed 42, chosen by ear 2026-11-01:
# the first set (Qwen3-TTS VoiceDesign, 2026-10-30) came out American. The first thirteen keep their Kokoro names
# (Kokoro speaks for them if Pocket fails); the rest have no Kokoro original, so "kokoro" names a stand-in.

[bm_lewis]
gender = "m"
age = "old"
description = 'An elderly man in his seventies with a broad Cornish accent, a retired fisherman, speaks slowly in a gravelly, wry voice'
line = "I've fished out of Port Wexley for fifty-one years, and I've never seen the quay this quiet in October. Mind you, the gulls haven't noticed."

[af_nova]
gender = "f"
age = "young"
description = 'A young woman in her twenties with a light Cornish accent from a small seaside town, speaks quickly and cheerfully, slightly exasperated'
line = 'Honestly, I just want the bus to turn up when it says it will. Is that too much to ask? Apparently it is.'

[af_nicole]
gender = "f"
age = "middle"
description = 'A woman in her fifties with a broad West Country accent who runs a harbourside cafe, speaks warmly, briskly and chattily'
line = "We open at seven, rain or shine, and the fishermen are in before the kettle's boiled. They'd live on bacon rolls if I let them."

[bf_emma]
gender = "f"
age = "middle"
description = 'A woman in her late thirties with a soft English West Country lilt, a primary school teacher, speaks clearly, kindly and with a dry humour'
line = 'The children wrote to the council themselves, every one of them, and I must say the spelling was better than some of the replies.'

[af_kore]
gender = "f"
age = "old"
description = 'An elderly woman in her late seventies with a soft Cornish burr, speaks gently, a little quavery, fond and amused'
line = "I've lived on Chapel Row since nineteen sixty-two, and in all that time the wind has never once come from the direction they said it would."

[af_aoede]
gender = "f"
age = "middle"
description = 'A woman in her mid-forties with a mild English West Country accent who owns a shop in a seaside town, speaks confidently, crisply and in a businesslike way'
line = "If the car park goes, the high street goes with it. It's as simple as that, and I've told the council so, twice, in writing."

[af_sky]
gender = "f"
age = "teen"
description = 'A teenage girl of sixteen with a light Cornish accent, a little shy at first and then quick and enthusiastic'
line = 'So we started the litter pick as a school thing, but now loads of people come along, and someone found an actual message in a bottle.'

[af_alloy]
gender = "f"
age = "old"
description = "A farmer's wife in her sixties with a broad Devon and Cornwall accent, speaks plainly in a low, no-nonsense voice"
line = "Them cows don't care what day it is. Christmas, bank holiday, flood, they want milking at half five and that's the end of it."

[am_puck]
gender = "m"
age = "young"
description = 'A young man in his mid-twenties with a light Cornish accent who works at a surf shop, speaks in a relaxed, cheerful, easy-going way'
line = "Best swell we've had since August, honestly. I was out at six, and by eight half the town was in the water with me."

[bm_daniel]
gender = "m"
age = "middle"
description = 'A man in his forties with a broad West Country accent, a plumber from a fishing family, speaks gruffly but friendly and plain-spoken'
line = "I've had my head under every sink on Harrow Street at one time or another, and I can tell you, the pipes are older than the mayor."

[am_fenrir]
gender = "m"
age = "middle"
description = 'A big man in his fifties with a warm West Country accent, a publican, speaks in a hearty, booming voice, quick to laugh'
line = "Quiz night's Thursday, and if anybody tells you the Anchor's team cheats, you send them to me. We just know a lot about boats."

[bm_fable]
gender = "m"
age = "young"
description = 'A man in his early thirties with a mild Cornish accent, a lifeboat volunteer, speaks earnestly, clearly and modestly'
line = "We got the call at about two in the morning. By the time we reached them they'd lit a flare, which helped a great deal, to be fair."

[am_adam]
gender = "m"
age = "old"
description = 'A man in his sixties with a light English West Country accent, a retired engineer, speaks precisely and a touch pompously, enjoying his own expertise'
line = "The swing bridge was built in eighteen ninety-four, and frankly it was over-engineered then. That's the only reason it's still standing."

[bf_wenna]
gender = "f"
age = "young"
kokoro = "af_sky"
description = 'A young woman of nineteen with a broad Cornish accent, a fish and chip shop worker, speaks fast, giggly and full of gossip'
line = "Saturday night we did three hundred portions, and the fryer packed in at nine. You should've heard the queue. Proper riot, it was."

[bf_tamara]
gender = "f"
age = "young"
kokoro = "af_sky"
description = 'A woman in her late twenties with a gentle, educated southern English accent, a marine biologist who moved to the coast, speaks thoughtfully and precisely'
line = "There are more seals in the estuary this year than we've counted since the survey began. That's good news, mostly, unless you're a mackerel."

[bf_jenifer]
gender = "f"
age = "middle"
kokoro = "bf_emma"
description = 'A woman in her fifties with a husky Cornish voice, a nurse at the cottage hospital, speaks briskly, kindly and without fuss'
line = "I've done nights on that ward for twenty years, and I'll tell you what keeps it going. Tea, biscuits, and people who turn up."

[bf_elowen]
gender = "f"
age = "old"
kokoro = "af_kore"
description = 'An elderly woman in her eighties with a refined, old-fashioned English accent, a retired headmistress, speaks crisply and a little sternly, with a twinkle'
line = "When I was headmistress, the school roof leaked in exactly the same place. I reported it in nineteen seventy-nine. I'm still waiting."

[bf_morwen]
gender = "f"
age = "old"
kokoro = "af_kore"
description = 'An old woman in her seventies with a broad, warm Cornish accent who keeps chickens, speaks slowly, chuckling, full of stories'
line = 'My mother kept hens on this very spot, and her mother before her. The foxes have changed, mind. Cheekier now.'

[bm_jowan]
gender = "m"
age = "teen"
kokoro = "bm_fable"
description = 'A teenage boy of seventeen with a Cornish accent, a sixth former, speaks a bit mumbly and awkward at first, then excited'
line = "It's not just a band, it's like, everyone from the youth club. We've got a gig at the Anchor, which is mental, honestly."

[bm_kit]
gender = "m"
age = "young"
kokoro = "bm_fable"
description = 'A young man in his late twenties with a London accent who moved to the coast, a barista and part-time artist, speaks quickly and drily'
line = "I moved down for the light, apparently. Turns out it rains sideways. Still, the coffee's good. I should know, I make it."

[bm_hedley]
gender = "m"
age = "middle"
kokoro = "bm_daniel"
description = 'A man in his forties with a rich, educated English accent, a vicar, speaks warmly and gently, a little self-deprecating'
line = 'The church roof appeal has raised four thousand pounds, two hundred of which came from one extremely competitive cake sale.'

[bm_ross]
gender = "m"
age = "middle"
kokoro = "bm_daniel"
description = 'A man in his fifties with a gruff Cornish accent, a harbour crane driver, speaks bluntly and quickly, impatient with nonsense'
line = "Forty tonnes on that hook, and the wind gusting thirty. You don't hurry that, I don't care whose boat it is."

[bm_jory]
gender = "m"
age = "old"
kokoro = "bm_lewis"
description = 'An old man in his eighties with a thin, reedy voice and a broad Cornish accent, a former lighthouse keeper, speaks slowly with long pauses, gently humorous'
line = 'Thirty years on the light, and I never once fell asleep on watch. Well. Not for long. The ships never knew.'

[bm_bernard]
gender = "m"
age = "old"
kokoro = "bm_lewis"
description = "A man in his late sixties with a plummy, upper-class English accent, a retired colonel who chairs the town's heritage society, speaks pompously and loudly"
line = 'The bandstand is a listed structure, and I will not stand by while it is painted turquoise. Turquoise! In Port Wexley!'

