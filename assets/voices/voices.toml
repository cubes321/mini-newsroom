# The council and three presenters: DramaBox (Resemble AI, LTX-2.3 audio) designs from a prompt alone, seed 42,
# chosen by ear 2026-11-01 over Qwen3-TTS VoiceDesign (its "West Country" came out American) and Kokoro blends.
# No Kokoro original: "kokoro" names the stand-in (tts.kokoro_voice). No gender or age: never offered to a guest.

[bf_strand]
person = 'Helen Strand'
kokoro = 'bf_emma'
description = 'A woman in her fifties with a crisp, educated southern English accent, a town mayor chairing a council meeting, speaks with calm, warm authority'
line = "Order, please. Councillor Tregarthen, you'll have your turn. We come now to item four, the harbour wall, and I'd ask everyone to keep it brief."

[bm_thorne]
person = 'Gerald Thorne'
kokoro = 'bm_lewis'
description = 'A man in his late sixties with a dry, precise English accent, a retired accountant, speaks slowly and deliberately, a little weary'
line = "I'm not against the scheme, Madam Mayor. I'm against paying for it twice. Show me a costing that adds up and you'll have my vote."

[bm_penhaligon]
person = 'Alan Penhaligon'
kokoro = 'bm_daniel'
description = 'A man in his late forties with a broad Cornish West Country accent, a plain-spoken local councillor, speaks earnestly and with some indignation'
line = 'Three months those lamps on the Salting path have been out. Three months. My residents are walking home by torchlight, and they want to know why.'

[bm_tregarthen]
person = 'Colin Tregarthen'
kokoro = 'bm_lewis'
description = 'A big man in his late sixties with a deep voice and a broad Cornish accent, an old trawler skipper, speaks bluntly and gruffly'
line = "The quay paid for this town long before the car park did. You mend the harbour first, and then we'll talk about flower baskets."

[bf_okoye]
person = 'Sandra Okoye'
kokoro = 'bf_emma'
description = 'A woman in her fifties with a warm English West Country accent, a shopkeeper on the town council, speaks firmly and persuasively'
line = "Every week that road is shut, my takings are down a third. I'm all for the drains, but do it at night, and do it quickly."

[bf_hammond]
person = 'Lucy Hammond'
kokoro = 'bf_emma'
description = 'A young woman of twenty-eight with a light English West Country accent, a passionate young councillor, speaks quickly and earnestly'
line = "We keep saying the young people are leaving. Well, of course they are. There's nowhere for them to live. That's what this motion is about."

[bm_nancarrow]
person = 'Tom Nancarrow'
kokoro = 'bm_lewis'
description = 'An old man in his seventies with a soft, broad, old-fashioned Cornish accent, a sly village storyteller, speaks gently with a twinkle'
line = "Over in Saltby we've had a ferry since before Port Wexley had a council. I only ask that this chamber remembers which side of the water it was on first."

[bf_jago]
person = 'Tamsin Jago'
kokoro = 'af_sarah'
description = 'A young woman of twenty-five with a light Cornish accent, a cheeky, energetic local sports reporter, speaks brightly and excitedly'
line = "And it's the Tides who take it, two goals to one, with the winner in the ninetieth minute. The Quarry Field hasn't been this loud all season!"
pace = "reference sped up 8% with pitch kept (WSOLA), 2026-11-01: she read too slowly, and Pocket follows its reference's pace"

[bm_lanyon]
person = 'Howard Lanyon'
kokoro = 'am_echo'
description = 'A man in his early sixties with a warm, low, educated English accent, a retired bank manager presenting the business news, speaks drily and wryly'
line = "Hake was up again at this morning's auction, which is good news for the boats, and rather less good news for anyone hoping for a cheap supper."

[bf_trethewey]
person = 'Meg Trethewey'
kokoro = 'af_river'
description = 'A woman in her late forties with a warm English West Country accent, a former coast path ranger presenting a days-out programme, speaks cheerfully and practically'
line = "It's a steep climb from the cove, and the wind will have your hat, but the view from the top is worth every step. And there's a tea room."

