[project]
name = "mini-newsroom"
version = "0.1.0"
description = "A pixel-art, always-on AI newsroom for a fictional town"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame>=2.6",
    "openai>=1.60",
    "anthropic>=0.50",
    "pydantic>=2.10",
    "soundfile>=0.13",
    "numpy>=1.26",
    "kokoro>=0.9",
    "pocket-tts>=4.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
